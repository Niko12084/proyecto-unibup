<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Búsqueda de Universidades</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="career-search.css">
</head>
<body>
    <div class="app-layout">
        <!-- Barra lateral pegada al borde -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-container">
                    <img src="images/logo unibup.png" alt="Logo UNIBUP" class="logo-img">
                </div>
            </div>
            
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item">
                    <div class="nav-icon">
                        <i class="fas fa-home"></i>
                    </div>
                    <span class="nav-text">Inicio</span>
                </a>
                
                <a href="aboutus.html" class="nav-item">
                    <div class="nav-icon">
                        <i class="fa-solid fa-comment"></i>
                    </div>
                    <span class="nav-text">Sobre Nosotros</span>
                </a>
            </nav>
        </aside>

        <!-- Contenido principal -->
        <main class="main-content">
            <header class="search-header">
                <div class="title-container">
                    <div class="title-icon">
                        <i class="fas fa-search"></i>
                    </div>
                    <div class="title-content">
                        <h1 class="main-title">Busca Universidades</h1>
                        <p class="title-subtitle">Encuentra la institución perfecta para tu futuro</p>
                    </div>
                </div>
            </header>

            <div class="content-container">
                <!-- 🧭 Breadcrumb dinámico -->
                <div class="breadcrumb-container">
                    <nav class="breadcrumb" aria-label="Migas de pan">
                        <ol class="breadcrumb-list">
                            <li class="breadcrumb-item">
                                <a href="index.html" class="breadcrumb-link">
                                    <i class="fas fa-home breadcrumb-icon"></i>
                                    <span class="breadcrumb-text">Inicio</span>
                                </a>
                            </li>
                            <li class="breadcrumb-item active">
                                <i class="fas fa-info-circle breadcrumb-icon"></i>
                                <span>Buscar Universidades</span>
                            </li>
                        </ol>
                    </nav>
                </div>

                <div class="search-main">
                    <div class="search-box">
                        <h2><i class="fas fa-search"></i> Busca universidades</h2>
                        <div class="search-input-container">
                            <input type="text" id="universityInput" placeholder="Ej: Universidad Nacional, Universidad de los Andes...">
                            <button id="searchBtn">Buscar <i class="fas fa-search"></i></button>
                        </div>
                    </div>

                    <div class="results-container" id="resultsContainer">
                        <div class="results-header">
                            <h3 id="resultsTitle">Todas las universidades disponibles</h3>
                            <div class="results-count" id="resultsCount"></div>
                        </div>

                        <div class="universities-list" id="universitiesList"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="career-search.js"></script>
</body>
</html>
